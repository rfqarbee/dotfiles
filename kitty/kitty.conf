font_family      family='Iosevka Nerd Font Mono' features=-calt
font_size 15.0
isable_ligatures all always

allow_remote_control socket
listen_on unix:@mykitty
enable_audio_bell no
window_padding_width 4.0
confirm_os_window_close 0
tab_bar_edge top
tab_bar_style powerline
tab_bar_min_tabs 1
active_tab_title_template "[{session_name}] {title}"

background_opacity 1.00
enabled_layouts splits:split_axis=horizontal
shell_integration enabled

scrollback_pager nvim --cmd 'set eventignore=FileType' +'set clipboard=unnamedplus' +'nnoremap q ZQ' +'call nvim_open_term(0, {})' +'set nomodified nolist rnu nu' +'$' -

# sessions in 1 single kitty window
tab_bar_filter session:~ or session:^$
startup_session $XDG_STATE_HOME/kitty/sessions/default.session

map kitty_mod+. launch --type=background kitten quick-access-terminal
map alt+\ goto_session -1
map ctrl+\ launch --type=overlay --title "kitty session" project-session.sh
map kitty_mod+s save_as_session --save-only --relocatable --use-foreground-process --match=session:. .
map kitty_mod+e pass_selection_to_program
map alt+shift+= launch --location=vsplit --cwd=current
map alt+shift+- launch --location=hsplit --cwd=current
map alt+shift+l launch --type=tab --cwd=current lazygit
map kitty_mod+l clear_terminal to_cursor_scroll active

map ctrl+left resize_window narrower
map ctrl+right resize_window wider
map ctrl+up resize_window taller
map ctrl+down resize_window shorter 3
map ctrl+home resize_window reset

map kitty_mod+0 change_font_size all 0
map ctrl+h neighboring_window left
map ctrl+l neighboring_window right
map ctrl+j neighboring_window down
map ctrl+k neighboring_window up
map alt+up move_window up
map alt+left move_window left
map alt+right move_window right
map alt+down move_window down

map alt+. set_tab_title
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5

map kitty_mod+right new_tab
map kitty_mod+t new_tab_with_cwd
map alt+shift+o open_url_with_hints

# BEGIN_KITTY_THEME
# Idle Toes
include current-theme.conf
# END_KITTY_THEME
